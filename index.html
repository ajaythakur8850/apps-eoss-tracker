<script>
/* ===== SETTINGS ===== */
var API_URL = 'https://script.google.com/macros/s/AKfycbwSPywNdYSR_1iM2Y0tnzWtnN9qD2upx8nHpg1pif3qvTwBxiY3qkeIF8QOf9zQamGU/exec';               // Google Apps Script URL (empty = sample mode in this browser)

<script></script>
<script>var MGT_DATA={am:[],stores:[],staff:[]};</script>
<script>// ===== Leave Planner core logic (shared by the web page demo and Google Apps Script) =====
var LeaveCore = (function () {
  function sha256(str) {
    var ascii = unescape(encodeURIComponent(String(str)));
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var maxWord = Math.pow(2, 32), i, j, result = '';
    var words = [], bitLen = ascii.length * 8;
    var hash = [], k = [], pc = 0, isComp = {};
    for (var c = 2; pc < 64; c++) {
      if (!isComp[c]) {
        for (i = 0; i < 313; i += c) isComp[i] = c;
        hash[pc] = (Math.pow(c, .5) * maxWord) | 0;
        k[pc++] = (Math.pow(c, 1 / 3) * maxWord) | 0;
      }
    }
    hash = hash.slice(0, 8);
    ascii += '\x80';
    while (ascii.length % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii.length; i++) {
      j = ascii.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = ((bitLen / maxWord) | 0);
    words[words.length] = (bitLen);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), old = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
          (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash);
        hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
    return result;
  }

  var STAFF_ROLES = ['SM', 'ASM', 'DM'];
  var LEAVE_TYPES = ['PL', 'CL', 'SL', 'Comp Off', 'Other'];
  var TOKEN_HOURS = 12;
  var DEFAULT_PIN = '1234';

  function create(db, env) {
    function fail(msg) { throw new Error(msg); }
    function up(s) { return String(s == null ? '' : s).trim().toUpperCase(); }
    function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s)); }
    function dayNum(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000; }
    function hashPin(emp, pin) { return sha256(env.secret + '|pin|' + up(emp) + '|' + String(pin)); }
    function users() { return db.all('Users'); }
    function findUser(emp) { emp = up(emp); return users().filter(function (u) { return up(u.emp) === emp; })[0]; }
    function isActive(u) { return String(u.active || 'Y').toUpperCase() !== 'N'; }
    function pub(u) { return { emp: up(u.emp), name: u.name, role: u.role, dept: u.dept || '', store: up(u.store), active: isActive(u) ? 'Y' : 'N' }; }
    function makeToken(u) {
      var exp = Date.now() + TOKEN_HOURS * 3600000;
      return up(u.emp) + '.' + exp + '.' + sha256(env.secret + '|tok|' + up(u.emp) + '|' + exp + '|' + u.pinHash);
    }
    function auth(token) {
      var p = String(token || '').split('.');
      if (p.length !== 3) fail('Please sign in again.');
      var u = findUser(p[0]);
      if (!u || !isActive(u)) fail('Please sign in again.');
      if (+p[1] < Date.now()) fail('Session expired. Please sign in again.');
      if (sha256(env.secret + '|tok|' + up(u.emp) + '|' + p[1] + '|' + u.pinHash) !== p[2]) fail('Please sign in again.');
      return u;
    }
    function leaves() { return db.all('Leaves'); }
    function canSee(u, store) { return u.role === 'AM' || up(u.store) === up(store); }
    function cleanLeave(l) {
      var o = {}; for (var key in l) if (key !== '_row') o[key] = l[key];
      o.days = +o.days || 0; return o;
    }
    function monthRange(m) {
      if (!/^\d{4}-\d{2}$/.test(String(m))) fail('Bad month');
      var y = +m.slice(0, 4), mo = +m.slice(5, 7);
      var last = new Date(Date.UTC(y, mo, 0)).getUTCDate();
      return [m + '-01', m + '-' + (last < 10 ? '0' : '') + last];
    }

    var actions = {
      login: function (r) {
        var u = findUser(r.emp);
        if (!u || !isActive(u)) fail('Emp Code not found or inactive.');
        if (hashPin(u.emp, r.pin) !== u.pinHash) fail('Wrong PIN.');
        return { token: makeToken(u), user: pub(u), mustChange: String(u.mustChange).toUpperCase() === 'Y' };
      },
      changePin: function (r) {
        var u = auth(r.token);
        if (hashPin(u.emp, r.oldPin) !== u.pinHash) fail('Current PIN is wrong.');
        if (!/^\d{4,6}$/.test(String(r.newPin))) fail('New PIN must be 4 to 6 digits.');
        if (String(r.newPin) === DEFAULT_PIN) fail('Please choose a PIN other than ' + DEFAULT_PIN + '.');
        var h = hashPin(u.emp, r.newPin);
        db.update('Users', 'emp', u.emp, { pinHash: h, mustChange: 'N' });
        u.pinHash = h;
        return { token: makeToken(u) };
      },
      load: function (r) {
        var u = auth(r.token);
        var range = monthRange(r.month);
        var staff = users().filter(function (x) { return x.role !== 'AM' && canSee(u, x.store); }).map(pub);
        var all = leaves();
        var month = all.filter(function (l) {
          return canSee(u, l.store) && l.status !== 'CANCELLED' && l.from <= range[1] && l.to >= range[0];
        }).map(cleanLeave);
        var pending = all.filter(function (l) {
          if (u.role === 'AM') return l.status === 'PENDING_AM' || l.status === 'PENDING_SM';
          if (u.role === 'SM') return l.status === 'PENDING_SM' && up(l.store) === up(u.store) && up(l.emp) !== up(u.emp);
          return false;
        }).map(cleanLeave);
        var mine = all.filter(function (l) { return up(l.emp) === up(u.emp); }).map(cleanLeave)
          .sort(function (a, b) { return a.from < b.from ? 1 : -1; }).slice(0, 30);
        var stores = db.all('Stores').filter(function (s) { return canSee(u, s.code); })
          .map(function (s) { return { code: up(s.code), name: s.name }; });
        return { user: pub(u), staff: staff, leaves: month, pending: pending, mine: mine, stores: stores, today: env.today(), types: LEAVE_TYPES };
      },
      apply: function (r) {
        var u = auth(r.token);
        if (STAFF_ROLES.indexOf(u.role) < 0) fail('Only SM, ASM and DM can apply for leave here.');
        if (!isDate(r.from) || !isDate(r.to)) fail('Please choose both dates.');
        if (r.from > r.to) fail('"From" date must be before "To" date.');
        if (r.from < env.today()) fail('You cannot plan leave for a past date.');
        var days = dayNum(r.to) - dayNum(r.from) + 1;
        if (days > 31) fail('Maximum 31 days in one request.');
        if (LEAVE_TYPES.indexOf(r.type) < 0) fail('Choose a leave type.');
        var clash = leaves().filter(function (l) {
          return up(l.emp) === up(u.emp) && l.status !== 'REJECTED' && l.status !== 'CANCELLED' && l.from <= r.to && l.to >= r.from;
        });
        if (clash.length) fail('You already have leave on these dates (' + clash[0].from + ' to ' + clash[0].to + ').');
        var hasSM = users().some(function (x) { return x.role === 'SM' && isActive(x) && up(x.store) === up(u.store); });
        var rec = {
          id: 'L' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36),
          emp: up(u.emp), name: u.name, role: u.role, store: up(u.store),
          from: r.from, to: r.to, days: days, type: r.type, reason: String(r.reason || '').slice(0, 200),
          status: (u.role === 'SM' || !hasSM) ? 'PENDING_AM' : 'PENDING_SM',
          smBy: '', smAt: '', smRemark: '', amBy: '', amAt: '', amRemark: '', createdAt: env.now()
        };
        db.insert('Leaves', rec);
        return { id: rec.id, status: rec.status };
      },
      decide: function (r) {
        var u = auth(r.token);
        var l = leaves().filter(function (x) { return x.id === r.id; })[0];
        if (!l) fail('Leave request not found.');
        var ok = r.decision === 'approve', remark = String(r.remark || '').slice(0, 200), patch;
        if (u.role === 'AM') {
          if (l.status !== 'PENDING_AM' && l.status !== 'PENDING_SM') fail('This request is already ' + l.status + '.');
          patch = { status: ok ? 'APPROVED' : 'REJECTED', amBy: u.name + ' (' + up(u.emp) + ')', amAt: env.now(), amRemark: remark };
        } else if (u.role === 'SM') {
          if (up(l.store) !== up(u.store)) fail('Not your store.');
          if (up(l.emp) === up(u.emp)) fail('You cannot approve your own leave.');
          if (l.status !== 'PENDING_SM') fail('This request is already ' + l.status + '.');
          patch = { status: ok ? 'PENDING_AM' : 'REJECTED', smBy: u.name + ' (' + up(u.emp) + ')', smAt: env.now(), smRemark: remark };
        } else fail('Only SM or AM can approve.');
        db.update('Leaves', 'id', l.id, patch);
        return { status: patch.status };
      },
      cancel: function (r) {
        var u = auth(r.token);
        var l = leaves().filter(function (x) { return x.id === r.id; })[0];
        if (!l || up(l.emp) !== up(u.emp)) fail('Leave request not found.');
        if (l.status === 'REJECTED' || l.status === 'CANCELLED') fail('Already ' + l.status + '.');
        if (l.status === 'APPROVED' && l.from <= env.today()) fail('Leave has already started; ask your AM.');
        db.update('Leaves', 'id', l.id, { status: 'CANCELLED' });
        return { status: 'CANCELLED' };
      },
      saveStore: function (r) {
        var u = auth(r.token);
        if (u.role !== 'AM') fail('Only AM can manage stores.');
        var code = up(r.code);
        if (!code) fail('Store code required.');
        var ex = db.all('Stores').filter(function (s) { return up(s.code) === code; })[0];
        if (ex) db.update('Stores', 'code', ex.code, { name: r.name || '' });
        else db.insert('Stores', { code: code, name: r.name || '' });
        return { code: code };
      },
      saveUser: function (r) {
        var u = auth(r.token);
        if (u.role !== 'AM') fail('Only AM can manage staff.');
        var emp = up(r.emp);
        if (!emp) fail('Emp Code required.');
        if (STAFF_ROLES.indexOf(r.role) < 0) fail('Role must be SM, ASM or DM.');
        if (!up(r.store)) fail('Store required.');
        if (!String(r.name || '').trim()) fail('Name required.');
        var ex = findUser(emp);
        if (ex && ex.role === 'AM') fail('That Emp Code belongs to an AM.');
        var patch = { name: String(r.name).trim(), role: r.role, dept: r.role === 'DM' ? String(r.dept || '') : '', store: up(r.store), active: r.active === 'N' ? 'N' : 'Y' };
        if (!ex || r.resetPin) { patch.pinHash = hashPin(emp, DEFAULT_PIN); patch.mustChange = 'Y'; }
        if (ex) db.update('Users', 'emp', ex.emp, patch);
        else { patch.emp = emp; db.insert('Users', patch); }
        return { emp: emp };
      }
    };

    return {
      hashPin: hashPin,
      handle: function (req) {
        var fn = actions[req && req.action];
        if (!fn) fail('Unknown action');
        return fn(req);
      }
    };
  }

  return { create: create, DEFAULT_PIN: DEFAULT_PIN, sha256: sha256, STAFF_ROLES: STAFF_ROLES, LEAVE_TYPES: LEAVE_TYPES };
})();
</script>

function todayStr(){return nowStr().slice(0,10);}

function fD(s){var p=s.split('-');return +p[2]+' '+MON[+p[1]-1];}
function fT(s){var h=+s.slice(11,13),m=s.slice(14,16);return (h%12||12)+':'+m+(h<12?' AM':' PM');}
function n0(x){return Math.round(x).toLocaleString('en-IN');}
function pc(x){return (isFinite(x)?x:0).toFixed(1)+'%';}

/* ---------- stock index ---------- */
var ST=null, IDX={}, STORE_LIST=[], OPEN={};
function initStock(st){ST=st;IDX={};OPEN={};STORE_LIST=Object.keys(ST.stores).sort();
  STORE_LIST.forEach(function(s){IDX[s]={};var t=0,dv={};ST.arts[s].forEach(function(a){IDX[s][a[0]]=a;t+=a[3];dv[a[1]]=(dv[a[1]]||0)+a[3];});OPEN[s]={qty:t,div:dv};});}
if(typeof EOSS_STOCK!=='undefined')initStock(EOSS_STOCK);
// live site: the stock list is stored encrypted (stock.enc); the key is given only to signed-in users
function b64bytes(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function loadStock(key){
  return fetch('stock.enc?v='+STOCK_VERSION,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Stock file missing');return r.arrayBuffer();}).then(function(buf){
    var b=new Uint8Array(buf);
    return crypto.subtle.importKey('raw',b64bytes(key),'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));});
  }).then(function(pt){initStock(JSON.parse(new TextDecoder().decode(pt)));});
}
function targetOf(q){return q>0?Math.max(1,Math.round(q*DAILY_TARGET_PCT/100)):0;}

/* ---------- sample backend (same login rules as Leave Planner) ---------- */
var DKEY='eossSample_v2',mem=null;
function tables(){if(mem)return mem;var r=ls(DKEY);if(r){try{mem=JSON.parse(r);return mem;}catch(e){}}mem=seed();save();return mem;}
function save(){ls(DKEY,JSON.stringify(mem));}
var db={all:function(t){return tables()[t].map(function(r){return Object.assign({},r);});},
 insert:function(t,o){tables()[t].push(Object.assign({},o));save();},
 update:function(t,k,v,p){var r=tables()[t].filter(function(x){return String(x[k]).toUpperCase()===String(v).toUpperCase();})[0];if(r){Object.assign(r,p);save();}}};
var env={secret:'eoss-sample',today:todayStr,now:nowStr};
var core=LeaveCore.create(db,env);
function seed(){
  var T={Users:[],Stores:[],Leaves:[],EOSS:{sales:{},hourly:{},uploads:[],names:{}}},h=function(e,p){return core.hashPin(e,p);};
  T.Users.push({emp:MGT_DATA.am[0],name:MGT_DATA.am[1],role:'AM',store:'',dept:'',pinHash:h(MGT_DATA.am[0],'1234'),mustChange:'Y',active:'Y'});
  MGT_DATA.staff.forEach(function(u){T.Users.push({emp:u.emp,name:u.name,role:u.role,dept:u.dept,store:u.store,pinHash:h(u.emp,'1234'),mustChange:'Y',active:'Y'});});
  // demo sales for day 1 (26 Nov): six hourly uploads, clearly marked as demo
  var rnd=(function(x){return function(){x=(x*1103515245+12345)%2147483648;return x/2147483648;};})(42);
  var day=ST.asOn, slots=['11:00','13:00','15:00','17:00','19:00','21:00'], frac=[.14,.3,.47,.63,.82,1];
  T.EOSS.sales[day]={};T.EOSS.hourly[day]={};
  STORE_LIST.forEach(function(s){
    var pool=ST.arts[s].filter(function(a){return a[3]>0;}), goal=Math.round(OPEN[s].qty*(0.02+rnd()*0.07)), arts={};
    for(var i=0;i<goal&&pool.length;i++){var a=pool[Math.floor(rnd()*pool.length)];if((arts[a[0]]||0)<a[3])arts[a[0]]=(arts[a[0]]||0)+1;}
    T.EOSS.sales[day][s]={at:day+' 21:00',by:'Demo',arts:arts,val:Object.keys(arts).reduce(function(t,k){return t+arts[k]*ST.flatPP;},0)};
    var tot=Object.keys(arts).reduce(function(t,k){return t+arts[k];},0);
    T.EOSS.hourly[day][s]=slots.map(function(sl,j){return [day+' '+sl,Math.round(tot*frac[j])];});
  });
  T.EOSS.uploads.push({at:day+' 21:00',by:'Demo data',file:'(sample figures)',dates:[day],stores:STORE_LIST.length,lines:0,matched:0,qty:0,demo:true});
  return T;
}
function resetDemo(){ls(DKEY,null);mem=null;logout();toast('Sample reset');}
function sampleEoss(req){
  var u=null; try{u=core.handle({action:'load',token:req.token,month:todayStr().slice(0,7)}).user;}catch(e){throw e;}
  var E=tables().EOSS;
  if(req.action==='eossLoad') return {user:u,sales:E.sales,hourly:E.hourly,uploads:E.uploads.slice(-30),names:E.names};
  if(req.action==='eossUpload'){
    var v;try{v=core.handle({action:'login',emp:req.emp,pin:req.pin}).user;}catch(e){throw new Error('Upload not allowed: '+e.message);}
    u=v;
    if(E.uploads.length&&E.uploads[0].demo){E.sales={};E.hourly={};E.uploads=[];}   // first real upload clears demo figures
    applyUpload(E,req.agg,req.at,u.name,req.meta); save(); return {ok:true};
  }
  throw new Error('Unknown action');
}
function applyUpload(E,agg,at,by,meta){
  Object.keys(agg).forEach(function(d){
    E.sales[d]=E.sales[d]||{};E.hourly[d]=E.hourly[d]||{};
    Object.keys(agg[d]).forEach(function(s){
      var arts=agg[d][s];E.sales[d][s]={at:at,by:by,arts:arts,val:(meta.vals&&meta.vals[d]&&meta.vals[d][s])||0};
      var tot=Object.keys(arts).reduce(function(t,k){return t+arts[k];},0);
      var hr=E.hourly[d][s]=E.hourly[d][s]||[];
      if(hr.length&&hr[hr.length-1][0]===at)hr[hr.length-1][1]=tot;else hr.push([at,tot]);
    });
  });
  Object.assign(E.names,meta.names||{});
  E.uploads.push({at:at,by:by,file:meta.file,dates:Object.keys(agg),stores:meta.stores,lines:meta.lines,matched:meta.matched,qty:meta.qty});
}
function api(action,p){
  p=p||{};p.action=action;if(S.token&&!p.token)p.token=S.token;
  if(!API_URL)return new Promise(function(res,rej){setTimeout(function(){try{var q=JSON.parse(JSON.stringify(p));res(/^eoss/.test(action)?sampleEoss(q):core.handle(q));}catch(e){rej(e);}},100);});
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Server error');return j.data;});
}
function handleErr(e){var m=e&&e.message||String(e);if(/sign in again|expired/i.test(m)){logout();$('lErr').textContent=m;}else toast(m);}

/* ---------- login / PIN ---------- */
function doLogin(){
  var e=$('lEmp').value.trim(),p=$('lPin').value.trim();$('lErr').textContent='';
  if(!e||!p){$('lErr').textContent='Enter E-Code and PIN.';return;}
  $('lBtn').disabled=true;
  api('login',{emp:e,pin:p}).then(function(r){S.view='dash';S.divStore=null;S.date=null;S.token=r.token;S.user=r.user;ls('eoss_tok2',r.token);$('lPin').value='';showApp();if(r.mustChange)openPin(true);})
  .catch(function(er){$('lErr').textContent=er.message;}).then(function(){$('lBtn').disabled=false;});
}
function logout(){S.view='dash';S.token=null;S.data=null;ls('eoss_tok2',null);$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');}
function openPin(force){$('pinModal').classList.remove('hidden');$('pErr').textContent='';['pOld','pNew','pNew2'].forEach(function(i){$(i).value='';});$('pinNote').textContent=force?'First sign-in: please set your own PIN (not 1234).':'';$('pCancel').classList.toggle('hidden',!!force);}
function closePin(){$('pinModal').classList.add('hidden');}
function savePin(){if($('pNew').value!==$('pNew2').value){$('pErr').textContent='New PINs do not match.';return;}
  api('changePin',{oldPin:$('pOld').value,newPin:$('pNew').value}).then(function(r){S.token=r.token;ls('eoss_tok2',r.token);closePin();toast('PIN changed');}).catch(function(e){$('pErr').textContent=e.message;});}
function showApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');refresh();}
function refresh(){
  return api('eossLoad').then(function(d){return (ST?Promise.resolve():loadStock(d.key)).then(function(){return d;});}).then(function(d){
    S.data=d;S.user=d.user;
    $('whoName').textContent=d.user.name+' · '+d.user.emp;
    $('whoRole').textContent=d.user.role==='AM'?'AM · all stores':(d.user.role+' · '+d.user.store);
    var ds=dates();if(!S.date||ds.indexOf(S.date)<0)S.date=ds[ds.length-1]||ST.asOn;
    render();
  }).catch(handleErr);
}

/* ---------- calculations ---------- */
function dates(){return Object.keys(S.data.sales).sort();}
function soldOf(d,s){var x=S.data.sales[d]&&S.data.sales[d][s];if(!x)return {q:0,div:{},arts:{},val:0};var q=0,dv={};Object.keys(x.arts).forEach(function(a){var r=IDX[s][a];if(!r)return;q+=x.arts[a];dv[r[1]]=(dv[r[1]]||0)+x.arts[a];});return {q:q,div:dv,arts:x.arts,at:x.at,val:+x.val||0};}
// opening stock of a day = stock file qty minus everything sold on earlier days (= previous day's balance)
function openOn(s,d,div){var o=div==null?OPEN[s].qty:(OPEN[s].div[div]||0);dates().forEach(function(x){if(x<d){var so=soldOf(x,s);o-=div==null?so.q:(so.div[div]||0);}});return Math.max(0,o);}
function storeRow(s,d){var o=openOn(s,d),td=soldOf(d,s);return {s:s,name:ST.stores[s],open:o,tgt:targetOf(o),today:td.q,val:td.val,st:o?td.q/o*100:0,bal:Math.max(0,o-td.q),at:td.at};}
function rows(d){return STORE_LIST.map(function(s){return storeRow(s,d);});}
function totals(rs){var t={open:0,today:0,bal:0,tgt:0,val:0};rs.forEach(function(r){t.open+=r.open;t.today+=r.today;t.bal+=r.bal;t.tgt+=r.tgt;t.val+=r.val;});t.st=t.open?t.today/t.open*100:0;return t;}
// sell-thru colour bands: below 2% red, 2–5% amber, above 5–8% green, above 8% dark green
function col(p){return p>8?['#1b7f3b','#fff']:p>5?['#7cc142','#10240a']:p>=2?['#f59e0b','#2b1900']:['#d93025','#fff'];}
function chip(p){var c=col(p);return '<span class="chip" style="background:'+c[0]+';color:'+c[1]+'">'+pc(p)+'</span>';}
function lastUpload(){var u=S.data.uploads;return u.length?u[u.length-1]:null;}
function myStore(){return null;}   // everyone sees the same full view – no store-wise restriction or highlight
var WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fDay(d){var p=d.split('-');return +p[2]+' '+MON[+p[1]-1]+' '+p[0]+', '+WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()];}
function legend(){return '<div class="legend"><span><s style="background:#d93025"></s>Below 2%</span><span><s style="background:#f59e0b"></s>2–5%</span><span><s style="background:#7cc142"></s>Above 5–8%</span><span><s style="background:#1b7f3b"></s>Above 8%</span></div>';}

function dateBar(extra){

  var sel=ds.length?'<select id="dSel" aria-label="Date" onchange="S.date=this.value;render()">'+ds.map(function(d){return '<option value="'+d+'"'+(d===S.date?' selected':'')+'>'+fDay(d)+'</option>';}).join('')+'</select>':'<b>'+fDay(S.date)+'</b>';
  return '<div class="toolbar">'+sel+(extra||'')+'<span class="sub" style="margin-left:auto">'+(lu?'Last update '+fD(lu.at.slice(0,10))+', '+fT(lu.at)+' by '+esc(lu.by):'No sale uploaded yet')+'</span></div>';

function kpis(r){

  return '<div class="kpis"><div class="kpi glass"><span>OPENING STOCK</span><b>'+n0(r.open)+'</b><span>Previous day\'s balance</span></div>'+
   '<div class="kpi glass"><span>TODAY SOLD QTY</span><b>'+n0(r.today)+'</b><span>EOSS articles only</span></div>'+
   '<div class="kpi glass"><span>SELL-THRU</span><b style="color:'+(c[0]==='#7cc142'?'#3d7a16':c[0]==='#f59e0b'?'#a35f00':c[0])+'">'+pc(r.st)+'</b><span>Target '+DAILY_TARGET_PCT+'% a day</span></div>'+
   '<div class="kpi glass pk"><span>BALANCE STOCK</span><b>'+n0(r.bal)+'</b><span>Opening stock for next day</span></div></div>';

     return '<tr'+(s===me?' class="me"':'')+'><td><b>'+s+'</b> '+esc(ST.stores[s])+'</td><td>'+n0(o)+'</td>'+slots.map(function(t){var v=at(s,t);if(v==null)return '<td class="sub">–</td>';var inc=v-prev;prev=v;last=v;return '<td><b>'+v+'</b> <span class="sub">'+(inc>0?'+'+inc:'')+'</span></td>';}).join('')+'<td>'+chip(o?last/o*100:0)+'</td></tr>';}).join('')+

}


/* ---------- snapshot for WhatsApp ---------- */
var SNAP=null;
function loadH2C(){return window.html2canvas?Promise.resolve():new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=res;s.onerror=function(){rej(new Error('Could not load the snapshot tool – check internet'));};document.head.appendChild(s);});}
function snapshot(id,label){
  id=id||'snapArea';label=label||'Store-wise';
  toast('Preparing snapshot…');
  loadH2C().then(function(){document.body.classList.add('snapping');return html2canvas($(id),{backgroundColor:'#ffffff',scale:2,windowWidth:Math.max(window.innerWidth,1000),ignoreElements:function(el){return el.classList&&el.classList.contains('nosnap');}});})
  .then(function(cv){document.body.classList.remove('snapping');cv.toBlob(function(b){if(SNAP)URL.revokeObjectURL(SNAP.url);SNAP={blob:b,url:URL.createObjectURL(b),name:'EOSS-'+label+'-'+S.date+'.png'};showSnap();},'image/png');})
  .catch(function(e){document.body.classList.remove('snapping');toast(e.message);});
}
function showSnap(){
  var canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([SNAP.blob],SNAP.name,{type:'image/png'})]}));}catch(e){}
  var m=document.createElement('div');m.className='modal';m.id='snapModal';
  m.innerHTML='<div class="glass" style="max-width:720px;width:100%;padding:16px;max-height:92vh;overflow:auto"><div style="font-weight:900;color:var(--blue);margin-bottom:8px">Snapshot ready</div><img src="'+SNAP.url+'" alt="Sell-thru snapshot" style="width:100%;border:1px solid #e3e7ee;border-radius:8px"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+
   (canShare?'<button class="btn" onclick="snapShare()">Share to WhatsApp</button>':'')+
   '<button class="btn blue" onclick="snapCopy()">Copy image</button><button class="btn ghost" onclick="snapDownload()">Download image</button><button class="btn ghost" onclick="closeSnap()">Close</button></div>'+
   '<div class="sub" style="margin-top:8px">'+(canShare?'Share opens your phone\'s share menu – pick WhatsApp and the store group.':'Copy, then paste (Ctrl+V) in WhatsApp Web / Desktop, or download and attach.')+'</div></div>';
  document.body.appendChild(m);
}
function closeSnap(){var m=$('snapModal');if(m)m.remove();}
function snapShare(){var f=new File([SNAP.blob],SNAP.name,{type:'image/png'});navigator.share({files:[f],title:'EOSS Store-wise Sell-thru',text:'Apps Winter EOSS – Store-wise sell-thru '+fDay(S.date)}).catch(function(){});}
function snapCopy(){try{navigator.clipboard.write([new ClipboardItem({'image/png':SNAP.blob})]).then(function(){toast('Image copied – paste it in WhatsApp');},function(){toast('Copy not allowed here – use Download');});}catch(e){toast('Copy not supported on this device – use Share or Download');}}
function snapDownload(){var a=document.createElement('a');a.href=SNAP.url;a.download=SNAP.name;document.body.appendChild(a);a.click();a.remove();}

/* ---------- upload (AM / upload team) ---------- */
var PENDING=null;
function vUpload(){
  var U=S.data.uploads.slice().reverse();
  return '<div class="glass pad"><h2>UPLOAD <em>SALE REPORT</em></h2><div class="glass pad" style="margin-bottom:12px;background:#f7faff"><div style="font-weight:700">Verify yourself before uploading</div><div style="display:flex;gap:10px;flex-wrap:wrap"><div style="flex:1 1 160px"><label for="uEmp">E-Code</label><input id="uEmp" inputmode="numeric" value="'+esc(S.user.emp)+'"></div><div style="flex:1 1 160px"><label for="uPin">PIN</label><input id="uPin" type="password" inputmode="numeric"></div></div></div><div class="drop"><div style="font-weight:700;margin-bottom:8px">Choose the 0ANALYSIS_PATTERN sale file (.xls / .xlsx / .csv)</div><input type="file" id="upFile" accept=".xls,.xlsx,.csv,.htm,.html" onchange="readFile(this.files[0])" style="max-width:360px;margin:0 auto"><div class="sub" style="margin-top:8px">Only Apps EOSS articles from the stock list are counted (Qty only). Uploading the same day again replaces that day\'s figure for those stores and adds a new hourly point.</div></div><div id="upPrev" style="margin-top:12px"></div></div>'+
   '<div class="glass pad" style="margin-top:14px"><h2>UPLOAD <em>HISTORY</em></h2><div class="tw"><table><thead><tr><th>Time</th><th>By</th><th>File</th><th>Bill date(s)</th><th>Stores</th><th>Lines read</th><th>EOSS lines</th><th>EOSS qty</th></tr></thead><tbody>'+
   (U.length?U.map(function(u){return '<tr><td>'+fD(u.at.slice(0,10))+' '+fT(u.at)+'</td><td>'+esc(u.by)+'</td><td>'+esc(u.file)+'</td><td>'+u.dates.map(fD).join(', ')+'</td><td>'+u.stores+'</td><td>'+u.lines+'</td><td>'+u.matched+'</td><td>'+u.qty+'</td></tr>';}).join(''):'<tr><td colspan="8">No uploads yet</td></tr>')+'</tbody></table></div></div>';
}
function qpDecode(txt){var b=txt.replace(/=\r?\n/g,''),bytes=[];for(var i=0;i<b.length;i++){if(b[i]==='='&&/^[0-9A-Fa-f]{2}$/.test(b.substr(i+1,2))){bytes.push(parseInt(b.substr(i+1,2),16));i+=2;}else bytes.push(b.charCodeAt(i)&255);}return new TextDecoder('utf-8').decode(new Uint8Array(bytes));}
function tableRows(htmlText){var doc=new DOMParser().parseFromString(htmlText,'text/html');return Array.prototype.map.call(doc.querySelectorAll('tr'),function(tr){return Array.prototype.map.call(tr.querySelectorAll('td,th'),function(c){return c.textContent.trim();});});}
function readFile(f){
  if(!f)return;$('upPrev').innerHTML='<div class="sub">Reading '+esc(f.name)+'…</div>';
  var fr=new FileReader();
  fr.onload=function(){try{
    var buf=new Uint8Array(fr.result),head=new TextDecoder('latin1').decode(buf.slice(0,600)),grid;
    if(/MIME-Version|Content-Type: multipart/i.test(head)){var t=new TextDecoder('latin1').decode(buf),bm=t.match(/boundary="?([^";\r\n]+)"?/i),parts=bm?t.split('--'+bm[1]):[t],part=parts.filter(function(p){return /text\/html/i.test(p.slice(0,400));})[0]||t;var body=part.split(/\r?\n\r?\n/).slice(1).join('\n\n');grid=tableRows(/quoted-printable/i.test(part.slice(0,400))?qpDecode(body):body);}
    else if(/<html|<table/i.test(head)){grid=tableRows(new TextDecoder('utf-8').decode(buf));}
    else{if(typeof XLSX==='undefined')throw new Error('Excel reader not loaded – check internet.');var wb=XLSX.read(buf,{type:'array'});grid=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false}).map(function(r){return r.map(function(c){return String(c==null?'':c).trim();});});}
    parseGrid(grid,f.name);
  }catch(e){$('upPrev').innerHTML='<div class="err">Could not read file: '+esc(e.message)+'</div>';}};
  fr.readAsArrayBuffer(f);
}
function toISO(s){var m=String(s).match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null;}
function parseGrid(grid,file){
  var agg={},vals={},names={},lines=0,matched=0,qty=0,stores={},unknown={};
  grid.forEach(function(c){
    var d=toISO(c[0]);if(!d)return;
    var st=String(c[1]||'').toUpperCase(),ai=-1;for(var i=2;i<c.length;i++){if(/^\d{9,18}$/.test(c[i])){ai=i;break;}}
    if(ai<0)return;lines++;
    var art=c[ai],q=parseFloat(String(c[ai+2]||'0').replace(/,/g,''))||0,v=parseFloat(String(c[ai+3]||'0').replace(/,/g,''))||0;
    if(!IDX[st]){unknown[st]=1;return;}
    stores[st]=1;
    if(!IDX[st][art])return;
    matched++;qty+=q;names[art]=c[ai+1]||'';
    agg[d]=agg[d]||{};agg[d][st]=agg[d][st]||{};agg[d][st][art]=(agg[d][st][art]||0)+q;vals[d]=vals[d]||{};vals[d][st]=(vals[d][st]||0)+v;
  });
  // stores present in the file but with no EOSS sale still get a 0 figure for that date
  var ds=Object.keys(agg);if(!ds.length){grid.some(function(c){var d=toISO(c[0]);if(d){ds=[d];return true;}});}
  ds.forEach(function(d){agg[d]=agg[d]||{};Object.keys(stores).forEach(function(s){agg[d][s]=agg[d][s]||{};});});
  if(!lines){$('upPrev').innerHTML='<div class="err">No sale lines found. Is this the 0ANALYSIS sale report?</div>';return;}
  PENDING={agg:agg,meta:{vals:vals,file:file,names:names,lines:lines,matched:matched,qty:qty,stores:Object.keys(stores).length}};
  $('upPrev').innerHTML='<div class="kpis"><div class="kpi glass"><span>BILL DATE(S)</span><b style="font-size:18px">'+ds.map(fD).join(', ')+'</b></div><div class="kpi glass"><span>STORES IN FILE</span><b>'+Object.keys(stores).length+'</b></div><div class="kpi glass"><span>SALE LINES READ</span><b>'+n0(lines)+'</b></div><div class="kpi glass pk"><span>EOSS LINES / QTY</span><b>'+matched+' / '+n0(qty)+'</b></div></div>'+
   (Object.keys(unknown).length?'<div class="sub">Ignored stores not in EOSS stock: '+Object.keys(unknown).join(', ')+'</div>':'')+
   (ds.some(function(d){return d<ST.asOn;})?'<div class="sub" style="color:#b45309;margin-bottom:8px">Note: bill date is before the EOSS stock date ('+fD(ST.asOn)+').</div>':'')+'<button class="btn" onclick="confirmUpload()">Update portal for everyone</button> <button class="btn ghost" onclick="PENDING=null;render()">Cancel</button>';
}
function confirmUpload(){if(!PENDING)return;var e=$('uEmp').value.trim(),p=$('uPin').value.trim();if(!e||!p){toast('Enter your E-Code and PIN to upload');$('uPin').focus();return;}api('eossUpload',{emp:e,pin:p,agg:PENDING.agg,meta:PENDING.meta,at:nowStr()}).then(function(){PENDING=null;toast('Portal updated');return refresh();}).then(function(){go('dash');}).catch(handleErr);}
function dlCsv(){var rs=rows(S.date),L=[['Date','Store','Name','Opening stock','Target','Sale qty','Sale value','Sell-thru %','Balance stock'].join(',')];
  rs.forEach(function(r){L.push([S.date,r.s,'"'+r.name+'"',r.open,r.tgt,r.today,r.val,r.st.toFixed(1),r.bal].join(','));});
  try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));a.download='EOSS-sellthru-'+S.date+'.csv';document.body.appendChild(a);a.click();a.remove();}catch(e){toast('Download not available here');}}
